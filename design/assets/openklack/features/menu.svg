<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">OpenKlack in the Mac menu bar</title>
  <desc id="desc">A native menu with sound status, mute, volume, two favorite sounds, and shortcuts to open or quit OpenKlack.</desc>
