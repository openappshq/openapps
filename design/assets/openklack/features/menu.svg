    <path d="M443 17v4"/>
  </g>
  <rect x="420" y="16" width="16" height="6" rx="1" fill="#242027"/>
  <rect x="114" y="47" width="330" height="298" rx="12" fill="url(#surface)" filter="url(#shadow)"/>
  <rect x="114.5" y="47.5" width="329" height="297" rx="11.5" stroke="#fff" stroke-opacity=".8"/>
