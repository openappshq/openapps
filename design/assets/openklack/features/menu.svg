    </linearGradient>
    <filter id="shadow" x="66" y="26" width="418" height="368" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dy="16" stdDeviation="16" flood-color="#422749" flood-opacity=".18"/>
      <feDropShadow dy="2" stdDeviation="3" flood-color="#422749" flood-opacity=".12"/>
    </filter>
  </defs>
  <path d="M0 0h480v38H0z" fill="#fff" fill-opacity=".38"/>
