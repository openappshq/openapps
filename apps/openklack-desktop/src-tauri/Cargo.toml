[package]
name = "openklack-desktop"
version = "0.1.0"
edition = "2024"
description = "A quiet little home for your keyboard sounds"
license = "MIT"

[lib]
name = "openklack"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "~2.11.5", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
tauri-plugin-updater = "~2.11.0"
tokio = { version = "1", features = ["macros", "sync"] }
biquad = "0.6.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
