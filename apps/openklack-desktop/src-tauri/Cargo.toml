[package]
name = "openklack-desktop"
version = "0.1.0"
edition = "2024"
description = "A quiet little home for your keyboard sounds"
license = "MIT"

[lib]
name = "openklack"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "~2.11.5", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
tauri-plugin-updater = { version = "~2.11.0", optional = true }
tokio = { version = "1", features = ["macros", "sync", "time"] }
biquad = "0.6.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
url = { version = "2", optional = true }
minisign-verify = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }
semver = { version = "1", optional = true }
libc = { version = "0.2", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
# The encrypted record store (LICENSING.md, "Record store"): AES-256-GCM under an HKDF-SHA256 key.
aes-gcm = { version = "=0.10.3", optional = true }
hkdf = { version = "=0.12.4", optional = true }
getrandom = { version = "=0.3.4", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"

[features]
# Off by default: builds from source have no License UI and never contact the license service.
# Official builds enable it and provide OPENKLACK_LICENSE_ENV plus the Dodo product IDs at build time (see build.rs).
licensing = ["dep:reqwest", "dep:rustls", "dep:chrono", "dep:url", "dep:aes-gcm", "dep:hkdf", "dep:getrandom", "dep:libc"]
# Off by default: builds from source never check, download or install app updates.
# Official builds enable it; the update public key comes from release/updater-public-key.txt (see build.rs).
updater = ["dep:tauri-plugin-updater", "dep:reqwest", "dep:rustls", "dep:url", "dep:minisign-verify", "dep:base64", "dep:semver", "dep:libc", "dep:tar", "dep:flate2"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
