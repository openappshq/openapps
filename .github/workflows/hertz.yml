name: Hertz

# Checks on every change to the app; a signed universal release when a
# `hertz-v<MAJOR.MINOR.PATCH>` tag is pushed (or on manual dispatch, which
# publishes only when asked). The release follows RELEASES.md: build, sign
# with the stable OpenApps HQ Release certificate, verify the pinned
# designated requirement, zip, publish the GitHub Release, bump the cask.
# Hertz has no in-app updater, so there is no feed to write; Homebrew is the
# update path. Setup and secrets: apps/hertz/RELEASING.md.
#
# The paths filter applies to branch pushes and pull requests; tag pushes
# always run, which is what the release needs.
on:
  pull_request:
    paths:
      - apps/hertz/**
      - scripts/release/**
      - packaging/homebrew/**
      - .github/workflows/hertz.yml
      - .github/rulesets/hertz-release-tags.json
  push:
    branches: [main]
    tags: [hertz-v*]
    paths:
      - apps/hertz/**
      - scripts/release/**
      - packaging/homebrew/**
      - .github/workflows/hertz.yml
      - .github/rulesets/hertz-release-tags.json
  workflow_dispatch:
    inputs:
      version:
        description: Version to build as MAJOR.MINOR.PATCH (ignored when running from a hertz-v* tag)
        type: string
        default: ""
      publish:
        description: Publish the release (creates the hertz-v<version> tag at this commit if it does not exist), then bump the cask
        type: boolean
        default: false
      allow_older:
        description: Allow publishing a version lower than the newest published release (a back-port)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: apps/hertz

env:
  # The release tag this run is about: the pushed tag, or hertz-v<input> on a
  # manual run from a branch. Build and publish serialise per tag, so a
  # second run for the same version queues behind the first instead of racing it.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version != '' && format('hertz-v{0}', inputs.version) || github.ref_name }}

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "Xcode 26 (macOS 26 SDK) is required."; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      # HertzCoreTests is pure logic (health score, diagnosis, process tree,
      # formatting, cleanup path rules against a temporary directory); nothing
      # in it reads the live system or needs a permission.
      - name: Build and test
        run: swift test
      - name: Lint the release scripts
        run: |
          brew install shellcheck >/dev/null
          shellcheck scripts/*.sh ../../scripts/release/*.sh ../../packaging/homebrew/bump-cask.sh
      - name: Check the cask template
        # bump-cask.sh must accept the template as a first release and refuse a rewrite.
        run: |
          cask="$RUNNER_TEMP/hertz.rb"
          cp ../../packaging/homebrew/Casks/hertz.rb "$cask"
          digest="$(printf 'a%.0s' $(seq 1 64))"
          ../../packaging/homebrew/bump-cask.sh "$cask" 0.1.0 "$digest"
          grep -q '^  version "0.1.0"$' "$cask"
          if ../../packaging/homebrew/bump-cask.sh "$cask" 0.1.0 "$(printf 'b%.0s' $(seq 1 64))" 2>/dev/null; then echo "rewrite accepted"; exit 1; fi
      - name: Build an ad-hoc signed development app
        env:
          UNIVERSAL: "1"
        run: |
          scripts/bundle.sh
          scripts/make-zip.sh
          scripts/verify-release.sh dist/Hertz-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hertz-development-unsigned
          path: apps/hertz/dist/*.zip
          retention-days: 7
          if-no-files-found: error

  # Builds, signs, verifies and zips the release. Read-only token: it never
  # touches tags, releases or the tap; that is the later jobs' business.
  release:
    # Only the canonical repository releases; a fork keeps the checks and nothing else.
    if: github.repository == 'openappshq/openapps' && (startsWith(github.ref, 'refs/tags/hertz-v') || github.event_name == 'workflow_dispatch')
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    environment: hertz-release
    concurrency:
      group: hertz-build-${{ github.event_name == 'push' && github.ref_name || inputs.version != '' && format('hertz-v{0}', inputs.version) || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      commit: ${{ steps.version.outputs.commit }}
      # The digest of the zip as verified here, and the id of the artifact it
      # was uploaded as: later jobs trust these, not what they download.
      sha256: ${{ steps.verify.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Full history: the build number is the commit count on HEAD.
          fetch-depth: 0
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "Xcode 26 (macOS 26 SDK) is required."; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          # A tag push always publishes; a manual run publishes only when asked,
          # whether it was started from a branch or from a release tag.
          if [ "$GITHUB_EVENT_NAME" = push ]; then publish=true; else publish="${INPUT_PUBLISH:-false}"; fi
          case "$GITHUB_REF" in
            refs/tags/hertz-v*)
              version="${GITHUB_REF#refs/tags/hertz-v}"
              if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$version" ]; then
                echo "This run is on tag $GITHUB_REF_NAME; leave the version input empty or set it to $version."; exit 1
              fi ;;
            *)
              version="$INPUT_VERSION"
              if [ -z "$version" ]; then echo "Give a version, or run from a hertz-v* tag."; exit 1; fi ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be MAJOR.MINOR.PATCH (got '$version')."; exit 1
          fi
          if [ "hertz-v$version" != "$RELEASE_TAG" ]; then
            echo "Internal error: resolved hertz-v$version but this run is serialised as $RELEASE_TAG."; exit 1
          fi
          {
            echo "version=$version"
            echo "tag=hertz-v$version"
            echo "publish=$publish"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building Hertz $version from $(git rev-parse HEAD) (publish: $publish)"
      - name: Check release configuration
        # Everything the release needs is checked up front, so a missing
        # secret fails here with its name and never produces a signed build
        # that cannot be published. Only public material is committed: the
        # pinned requirement must have been generated.
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          missing=0
          for name in RELEASE_SIGNING_P12 RELEASE_SIGNING_P12_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set in the hertz-release environment."; missing=1; fi
          done
          if [ "$PUBLISH" = true ]; then
            for name in RULESET_READ_TOKEN HOMEBREW_TAP_TOKEN; do
              if [ -z "${!name}" ]; then echo "::error::Secret $name is not set in the hertz-release environment; publishing needs it."; missing=1; fi
            done
          fi
          if grep -q '^NOT GENERATED' release/designated-requirement.txt; then
            echo "::error::release/designated-requirement.txt has not been generated yet (RELEASES.md)."; missing=1
          fi
          [ "$missing" = 0 ] || exit 1
      - name: Build, sign and verify the universal app
        # The identity lives in a temporary keychain for exactly this step;
        # with-signing-keychain.sh removes it before the step ends and fails
        # if it can still be found. bundle.sh refuses a certificate whose
        # designated requirement is not the pinned one.
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          UNIVERSAL: "1"
        run: ../../scripts/release/with-signing-keychain.sh scripts/bundle.sh
      - name: Confirm the signing identity is gone
        run: |
          if security find-identity -p codesigning 2>/dev/null | grep -q 'OpenApps HQ Release'; then
            echo "::error::The release signing identity is still available after the build."; exit 1
          fi
      - name: Zip and verify the release
        id: verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/make-zip.sh
          scripts/verify-release.sh --release "dist/Hertz-$VERSION.zip"
          cd dist
          shasum -a 256 "Hertz-$VERSION.zip" | tee "Hertz-$VERSION.zip.sha256"
          echo "sha256=$(cut -d' ' -f1 "Hertz-$VERSION.zip.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: Hertz-${{ steps.version.outputs.version }}-signed
          path: |
            apps/hertz/dist/*.zip
            apps/hertz/dist/*.sha256
          if-no-files-found: error

  # Publishes the verified zip. The only job with a token that can write
  # releases; it runs no build, only scripts/publish-release.sh, which
  # requires the hertz-v* tag ruleset to be active with no bypass actors and
  # refuses unless the tag names exactly the commit the zip was built from
  # and the zip has exactly the digest the release job verified.
  publish:
    if: github.repository == 'openappshq/openapps' && needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hertz-release
    # One publication at a time across all versions, so the newest-version
    # check and the final publish of two releases can never interleave.
    concurrency:
      group: hertz-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          # By id, not by name: exactly the artifact the release job uploaded.
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: apps/hertz/dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          BUILT_COMMIT: ${{ needs.release.outputs.commit }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          CREATE_TAG: ${{ github.event_name == 'workflow_dispatch' }}
          ALLOW_OLDER: ${{ inputs.allow_older == true }}
        run: scripts/publish-release.sh

  # Once the release is public: check the public zip has the verified digest,
  # then bump the cask in the tap. No build runs here and no signing material
  # is present.
  cask:
    if: github.repository == 'openappshq/openapps'
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hertz-release
    concurrency:
      group: hertz-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the public download
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          url="https://github.com/$GH_REPO/releases/download/hertz-v$VERSION/Hertz-$VERSION.zip"
          curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/Hertz-$VERSION.zip" "$url"
          actual="$(sha256sum "$RUNNER_TEMP/Hertz-$VERSION.zip" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::$url has SHA-256 $actual, but the release job verified $EXPECTED_SHA256."; exit 1
          fi
          echo "ok: $url $actual"
      - name: Bump the cask
        working-directory: .
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$auth" clone --depth 1 https://github.com/openappshq/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          if [ ! -f "$RUNNER_TEMP/tap/Casks/hertz.rb" ]; then cp packaging/homebrew/Casks/hertz.rb "$RUNNER_TEMP/tap/Casks/hertz.rb"; fi
          packaging/homebrew/bump-cask.sh "$RUNNER_TEMP/tap/Casks/hertz.rb" "$VERSION" "$SHA256"
          cd "$RUNNER_TEMP/tap"
          git config user.name "openapps-release"
          git config user.email "release@openapps.space"
          git add Casks/hertz.rb
          if git diff --cached --quiet; then echo "The cask already names $VERSION."; exit 0; fi
          git commit -m "hertz $VERSION"
          git -c "http.https://github.com/.extraheader=$auth" push origin HEAD
