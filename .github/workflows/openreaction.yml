name: OpenReaction

# Checks on every change to the app; a signed universal release when an
# `openreaction-v<MAJOR.MINOR.PATCH>` tag is pushed (or on manual dispatch,
# which publishes only when asked). The release flow follows RELEASES.md:
# build and sign, zip, update-sign, publish, commit the feed, verify live,
# bump the cask. See apps/openreaction/RELEASING.md.
#
# The paths filter applies to branch pushes and pull requests; tag pushes
# always run, which is what the release needs.
on:
  pull_request:
    paths:
      - apps/openreaction/**
      - packages/openapps-licensing/**
      - packages/openapps-updater/**
      - packaging/homebrew/**
      - scripts/release/**
      - .github/workflows/openreaction.yml
      - .github/rulesets/openreaction-release-tags.json
  push:
    branches: [main]
    tags: [openreaction-v*]
    paths:
      - apps/openreaction/**
      - packages/openapps-licensing/**
      - packages/openapps-updater/**
      - packaging/homebrew/**
      - scripts/release/**
      - .github/workflows/openreaction.yml
      - .github/rulesets/openreaction-release-tags.json
  workflow_dispatch:
    inputs:
      version:
        description: Version to build as MAJOR.MINOR.PATCH (ignored when running from an openreaction-v* tag)
        type: string
        default: ""
      publish:
        description: Publish a GitHub Release (creates the openreaction-v<version> tag at this commit if it does not exist)
        type: boolean
        default: false
      allow_older:
        description: Allow publishing a version lower than the newest published release (a back-port)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: apps/openreaction

env:
  # The checks job compiles the licensed flavour against Dodo test mode with
  # placeholder product IDs; nothing built with these is ever published.
  PLACEHOLDER_PAID_PRODUCT_ID: pdt_placeholder_openreaction
  # The release tag this run is about: the pushed tag, or openreaction-v<input>
  # on a manual run from a branch. Build and publish serialise per tag, so a
  # second run for the same version queues behind the first instead of racing it.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version != '' && format('openreaction-v{0}', inputs.version) || github.ref_name }}

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "Xcode 26 (macOS 26 SDK) is required."; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      # Only suites that never post CGEvents or install an event tap run here:
      # the whole core library and the gate runner shutdown suite.
      # KeyboardTapTests and anything else that touches real input stay out
      # of CI. The licensing rules, stores and clients (the preferences
      # journal included) are tested with their package below.
      - name: Build and test the source flavour
        run: swift test --filter 'OpenReactionCoreTests|OpenReactionTests.GateRunnerShutdownTests'
      - name: Build and test the licensed flavour
        env:
          OPENAPPS_LICENSING: "1"
          OPENAPPS_DODO_ENV: test
          OPENAPPS_DODO_PAID_PRODUCT_ID: ${{ env.PLACEHOLDER_PAID_PRODUCT_ID }}
        run: |
          scripts/generate-licensing-config.sh Sources/OpenReaction/Licensing/LicensingConfig.swift
          swift test --scratch-path .build/licensed \
            --filter 'OpenReactionCoreTests|OpenReactionTests.GateRunnerShutdownTests'
      - name: Test the licensing package
        run: swift test --package-path ../../packages/openapps-licensing
      - name: Test the updater package
        run: swift test --package-path ../../packages/openapps-updater
      - name: Lint and test the release scripts
        run: |
          brew install shellcheck actionlint
          shellcheck scripts/*.sh scripts/tests/*.sh ../../scripts/release/*.sh ../../scripts/release/tests/*.sh ../../packaging/homebrew/*.sh ../../packaging/homebrew/tests/*.sh
          actionlint ../../.github/workflows/openreaction.yml
          scripts/tests/scan-binary.test.sh
          ../../scripts/release/tests/with-signing-keychain.test.sh
          ../../packaging/homebrew/tests/bump-cask.test.sh
      # The official flavour (licensing and the updater) as an ad-hoc signed
      # development app, pinning a throwaway update key so the build does not
      # depend on the real key existing; it verifies like a release except
      # for the signature.
      - name: Build an ad-hoc signed official development app
        env:
          OPENAPPS_LICENSING: "1"
          OPENAPPS_OFFICIAL: "1"
          OPENAPPS_DODO_ENV: test
          OPENAPPS_DODO_PAID_PRODUCT_ID: ${{ env.PLACEHOLDER_PAID_PRODUCT_ID }}
          UNIVERSAL: "1"
          SCRATCH_PATH: .build/official
        run: |
          UPDATE_PUBLIC_ED_KEY="$(xcrun swift -e 'import CryptoKit; print(Curve25519.Signing.PrivateKey().publicKey.rawRepresentation.base64EncodedString())')"
          export UPDATE_PUBLIC_ED_KEY
          scripts/bundle.sh
          scripts/make-zip.sh
          scripts/verify-release.sh dist/OpenReaction-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenReaction-development-unsigned
          path: apps/openreaction/dist/*.zip
          retention-days: 7
          if-no-files-found: error

  # Builds, signs, verifies and packages the release. Read-only token: it
  # never touches tags, releases, the feed or the tap.
  release:
    # Never in a fork: the environment, its secrets and the publish path belong to this repository.
    if: github.repository == 'openappshq/openapps' && (startsWith(github.ref, 'refs/tags/openreaction-v') || github.event_name == 'workflow_dispatch')
    needs: checks
    runs-on: macos-26
    timeout-minutes: 90
    environment: openreaction-release
    concurrency:
      group: openreaction-build-${{ github.event_name == 'push' && github.ref_name || inputs.version != '' && format('openreaction-v{0}', inputs.version) || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      commit: ${{ steps.version.outputs.commit }}
      # The digest of the zip as verified here, and the id of the artifact it
      # was uploaded as: later jobs trust these, not what they download.
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Full history: the build number is the commit count on HEAD.
          fetch-depth: 0
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "Xcode 26 (macOS 26 SDK) is required."; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          # A tag push always publishes; a manual run publishes only when asked,
          # whether it was started from a branch or from a release tag.
          if [ "$GITHUB_EVENT_NAME" = push ]; then publish=true; else publish="${INPUT_PUBLISH:-false}"; fi
          case "$GITHUB_REF" in
            refs/tags/openreaction-v*)
              version="${GITHUB_REF#refs/tags/openreaction-v}"
              if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$version" ]; then
                echo "This run is on tag $GITHUB_REF_NAME; leave the version input empty or set it to $version."; exit 1
              fi ;;
            *)
              version="$INPUT_VERSION"
              if [ -z "$version" ]; then echo "Give a version, or run from an openreaction-v* tag."; exit 1; fi ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be MAJOR.MINOR.PATCH (got '$version')."; exit 1
          fi
          if [ "openreaction-v$version" != "$RELEASE_TAG" ]; then
            echo "Internal error: resolved openreaction-v$version but this run is serialised as $RELEASE_TAG."; exit 1
          fi
          {
            echo "version=$version"
            echo "tag=openreaction-v$version"
            echo "publish=$publish"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building OpenReaction $version from $(git rev-parse HEAD) (publish: $publish)"
      - name: Check release configuration
        # Everything the release needs is checked up front, so a missing
        # secret fails here with its name and never produces a signed build
        # that cannot be published. Only public material is committed: the
        # pinned requirement and the update public key must have been generated.
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
          FEED_COMMIT_TOKEN: ${{ secrets.FEED_COMMIT_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          OPENAPPS_DODO_PAID_PRODUCT_ID: ${{ vars.OPENAPPS_DODO_PAID_PRODUCT_ID }}
          OPENAPPS_BUY_URL: ${{ vars.OPENAPPS_BUY_URL }}
          OPENAPPS_SUPPORT_URL: ${{ vars.OPENAPPS_SUPPORT_URL }}
        run: |
          missing=0
          for name in RELEASE_SIGNING_P12 RELEASE_SIGNING_P12_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set in the openreaction-release environment."; missing=1; fi
          done
          # Only publication uses these, but a missing token should fail before a 30-minute build, not after.
          if [ "$PUBLISH" = true ]; then
            for name in RULESET_READ_TOKEN FEED_COMMIT_TOKEN HOMEBREW_TAP_DEPLOY_KEY; do
              if [ -z "${!name}" ]; then echo "::error::Secret $name is not set in the openreaction-release environment; publishing needs it."; missing=1; fi
            done
          fi
          if [ -z "$OPENAPPS_DODO_PAID_PRODUCT_ID" ]; then
            echo "::error::Variable OPENAPPS_DODO_PAID_PRODUCT_ID is not set in the openreaction-release environment."; missing=1
          fi
          for file in release/designated-requirement.txt release/sparkle-public-key.txt; do
            if grep -q '^NOT GENERATED' "$file"; then
              echo "::error::$file has not been generated yet; create the release certificate and update key first (apps/openreaction/RELEASING.md, \"Signing certificate and update key\")."; missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          case "$OPENAPPS_DODO_PAID_PRODUCT_ID" in
            pdt_*) ;;
            *) echo "::error::OPENAPPS_DODO_PAID_PRODUCT_ID must be a Dodo product ID (pdt_…)."; exit 1 ;;
          esac
          # The generator validates the URLs' shape; this only reports what is configured.
          for name in OPENAPPS_BUY_URL OPENAPPS_SUPPORT_URL; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: not set (optional)"; fi
          done
      - name: Build, sign and verify the universal release
        # The identity lives in a temporary keychain for exactly this step;
        # with-signing-keychain.sh removes it before the step ends and fails
        # if it can still be found. bundle.sh signs with the pinned designated
        # requirement and refuses a certificate that does not produce it.
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          UNIVERSAL: "1"
          OPENAPPS_LICENSING: "1"
          OPENAPPS_OFFICIAL: "1"
          OPENAPPS_DODO_ENV: live
          OPENAPPS_DODO_PAID_PRODUCT_ID: ${{ vars.OPENAPPS_DODO_PAID_PRODUCT_ID }}
          OPENAPPS_BUY_URL: ${{ vars.OPENAPPS_BUY_URL }}
          OPENAPPS_SUPPORT_URL: ${{ vars.OPENAPPS_SUPPORT_URL }}
        run: ../../scripts/release/with-signing-keychain.sh scripts/bundle.sh
      - name: Confirm the signing identity is gone
        # Nothing after this point may sign: the zip, the feed, the upload and
        # the publish only need the update key and tokens.
        run: |
          if security find-identity -p codesigning 2>/dev/null | grep -q 'OpenApps HQ Release'; then
            echo "::error::The release signing identity is still available after the build."; exit 1
          fi
      - name: Zip, verify and sign the update
        id: package
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Feed verification needs OpenSSL 3 (Ed25519); macOS ships LibreSSL.
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          scripts/make-zip.sh
          scripts/verify-release.sh --release "dist/OpenReaction-$VERSION.zip"
          scripts/make-appcast.sh "dist/OpenReaction-$VERSION.zip"
          echo "sha256=$(cut -d' ' -f1 "dist/OpenReaction-$VERSION.zip.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: OpenReaction-${{ steps.version.outputs.version }}-signed
          path: |
            apps/openreaction/dist/*.zip
            apps/openreaction/dist/*.sha256
            apps/openreaction/dist/appcast.xml
          if-no-files-found: error

  # Publishes the verified zip. The only job with a token that can write
  # releases; it runs no build, only scripts/publish-release.sh, which
  # requires the openreaction-v* tag ruleset to be active with no bypass
  # actors and refuses unless the tag names exactly the commit the zip was
  # built from and the zip has exactly the digest the release job verified.
  publish:
    if: github.repository == 'openappshq/openapps' && needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openreaction-release
    # One publication at a time across all versions, so the newest-version
    # check and the final publish of two releases can never interleave.
    concurrency:
      group: openreaction-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          # By id, not by name: exactly the artifact the release job uploaded.
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: apps/openreaction/dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          BUILT_COMMIT: ${{ needs.release.outputs.commit }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          CREATE_TAG: ${{ github.event_name == 'workflow_dispatch' }}
          ALLOW_OLDER: ${{ inputs.allow_older == true }}
        run: scripts/publish-release.sh

  # Once the release is public: commit the signed feed to main (the website
  # deploy serves it), verify the live feed and zip, then bump the cask.
  # No build runs here and no signing material is present; the feed was
  # signed by the release job and is only checked again here.
  feed:
    if: github.repository == 'openappshq/openapps'
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: openreaction-release
    concurrency:
      group: openreaction-publish
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: apps/openreaction/dist
          merge-multiple: true
      - name: Check the feed against the published release
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          cd apps/openreaction
          read -r version _ url sha256 < <(scripts/verify-appcast.sh dist/appcast.xml "dist/OpenReaction-$VERSION.zip")
          expected_url="https://github.com/openappshq/openapps/releases/download/openreaction-v$VERSION/OpenReaction-$VERSION.zip"
          if [ "$version" != "$VERSION" ] || [ "$sha256" != "$EXPECTED_SHA256" ] || [ "$url" != "$expected_url" ]; then
            echo "::error::dist/appcast.xml announces $version $sha256 at $url, not $VERSION $EXPECTED_SHA256 at $expected_url"; exit 1
          fi
      - name: Never move the stable feed backwards
        # The feed and the cask only ever advance. A back-port (allow_older)
        # is published as a GitHub Release and nothing else: installed apps
        # never downgrade anyway, and the cask refuses lower versions.
        id: order
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ALLOW_OLDER: ${{ inputs.allow_older == true }}
        run: |
          current=""
          if [ -f apps/website/public/updates/openreaction/appcast.xml ]; then
            read -r current _ < <(cd apps/openreaction && scripts/verify-appcast.sh ../website/public/updates/openreaction/appcast.xml)
          fi
          if [ -n "$current" ] && [ "$current" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" = "$current" ]; then
            if [ "$ALLOW_OLDER" != true ]; then
              echo "::error::The live feed is at $current, newer than $VERSION; a lower version is never promoted."; exit 1
            fi
            echo "::notice::$VERSION is a back-port below the live feed's $current: the release is published, the feed and the cask stay at $current."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the feed to main
        if: steps.order.outputs.promote == 'true'
        env:
          FEED_COMMIT_TOKEN: ${{ secrets.FEED_COMMIT_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p apps/website/public/updates/openreaction
          cp apps/openreaction/dist/appcast.xml apps/website/public/updates/openreaction/appcast.xml
          git config user.name "openapps-release"
          git config user.email "release@openapps.space"
          git add apps/website/public/updates/openreaction/appcast.xml
          if git diff --cached --quiet; then echo "The feed already names $VERSION."; exit 0; fi
          git commit -m "Point OpenReaction's update feed at $VERSION"
          # The token is passed per command and never written to .git/config.
          for _ in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FEED_COMMIT_TOKEN" | base64 | tr -d '\n')" push "https://github.com/$REPO.git" HEAD:main; then exit 0; fi
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FEED_COMMIT_TOKEN" | base64 | tr -d '\n')" pull --rebase "https://github.com/$REPO.git" main
          done
          echo "::error::Could not push the feed to main after 3 attempts."; exit 1
      - name: Verify the live feed and download
        if: steps.order.outputs.promote == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          # The website deploys from main after the commit above.
          WAIT_SECONDS: "1500"
        run: apps/openreaction/scripts/verify-live.sh "$VERSION" "$EXPECTED_SHA256"
      - name: Bump the cask
        if: steps.order.outputs.promote == 'true'
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          # The tap is pushed with a deploy key that can write only to that repository.
          umask 077; install -d "$RUNNER_TEMP/tap-key"; printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap-key/id"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/tap-key/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap-key/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/tap-key/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/tap-key"' EXIT
          git clone --depth 1 git@github.com:openappshq/homebrew-tap.git tap
          mkdir -p tap/Casks
          if [ ! -f tap/Casks/openreaction.rb ]; then cp packaging/homebrew/Casks/openreaction.rb tap/Casks/openreaction.rb; fi
          packaging/homebrew/bump-cask.sh tap/Casks/openreaction.rb "$VERSION" "$SHA256"
          cd tap
          git config user.name "openapps-release"
          git config user.email "release@openapps.space"
          git add Casks/openreaction.rb
          if git diff --cached --quiet; then echo "The cask already names $VERSION."; exit 0; fi
          git commit -m "openreaction $VERSION"
          git push origin HEAD
