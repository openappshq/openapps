name: OpenReaction

# Checks on every change to the app; a signed universal release when an
# `openreaction-v<MAJOR.MINOR.PATCH>` tag is pushed (or on manual dispatch,
# which publishes only when asked). The release flow follows RELEASES.md:
# build and sign, zip, update-sign, publish, commit the feed, verify live,
# bump the cask. See apps/openreaction/RELEASING.md.
#
# The checks run what the change touches and nothing more (RELEASES.md,
# "Pipeline"): a preflight job classifies the diff and, on a manual run,
# looks for a run of these checks that already passed for this commit; the
# flavours then build and test in parallel, each from a cached build
# directory, with the heavy tests left to nightly.yml.
#
# The paths filter applies to branch pushes and pull requests; tag pushes
# always run, which is what the release needs. Markdown never triggers.
on:
  pull_request:
    paths:
      - apps/openreaction/**
      - packages/openapps-licensing/**
      - packages/openapps-updater/**
      - scripts/release/**
      - packaging/homebrew/**
      - .github/workflows/openreaction.yml
      - .github/workflows/nightly.yml
      - .github/workflows/site.yml
      - .github/rulesets/openreaction-release-tags.json
      - "!**/*.md"
  push:
    branches: [main, pipeline-fast-checks]
    tags: [openreaction-v*]
    paths:
      - apps/openreaction/**
      - packages/openapps-licensing/**
      - packages/openapps-updater/**
      - scripts/release/**
      - packaging/homebrew/**
      - .github/workflows/openreaction.yml
      - .github/workflows/nightly.yml
      - .github/workflows/site.yml
      - .github/rulesets/openreaction-release-tags.json
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build as MAJOR.MINOR.PATCH (ignored when running from a openreaction-v* tag)
        type: string
        default: ""
      publish:
        description: Publish a GitHub Release (creates the openreaction-v<version> tag at this commit if it does not exist), then commit the feed and bump the cask
        type: boolean
        default: false
      allow_older:
        description: Allow publishing a version lower than the newest published release (a back-port)
        type: boolean
        default: false

# A newer push to the same branch or pull request cancels the older run's
# checks; a tag push or a manual run (a release) is never cancelled and
# cancels nothing — its own group is the run.
concurrency:
  group: openreaction-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: apps/openreaction

env:
  # The checks compile the licensed flavour against Dodo test mode with a
  # placeholder product ID; nothing built with it is ever published, and
  # verify-release.sh --release refuses a binary that contains it.
  PLACEHOLDER_PAID_PRODUCT_ID: pdt_placeholder_openreaction
  # The release tag this run is about: the pushed tag, or openreaction-v<input> on a
  # manual run from a branch. Build and publish serialise per tag, so a
  # second run for the same version queues behind the first instead of racing it.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version != '' && format('openreaction-v{0}', inputs.version) || github.ref_name }}
  # Tests marked heavy (minutes of rendering) run nightly, not here.
  OPENAPPS_HEAVY_TESTS: "0"

jobs:
  # What this run has to check. On a manual run, first whether a run of
  # these checks already passed for this commit (scripts/release/checks-passed.sh);
  # then which legs and steps the change calls for (scripts/release/changes.sh).
  # A push or pull request never relies on an earlier run.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The runs, jobs and plan artifact of earlier runs.
      actions: read
    defaults:
      run:
        working-directory: .
    outputs:
      checks: ${{ steps.evidence.outputs.checks }}
      checks_run: ${{ steps.evidence.outputs.run }}
      flavours: ${{ steps.changes.outputs.flavours }}
      suite: ${{ steps.changes.outputs.suite }}
      flavour_suite: ${{ steps.changes.outputs.flavour_suite }}
      bundle: ${{ steps.changes.outputs.bundle }}
      update_e2e: ${{ steps.changes.outputs.update_e2e }}
      licensing_tests: ${{ steps.changes.outputs.licensing_tests }}
      updater_tests: ${{ steps.changes.outputs.updater_tests }}
      lint: ${{ steps.changes.outputs.lint }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The history, to diff against the previous push.
          fetch-depth: 0
      - name: Look for a passed run of these checks
        id: evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if run="$(scripts/release/checks-passed.sh openreaction.yml "$GITHUB_SHA")"; then
            echo "checks=passed" >> "$GITHUB_OUTPUT"
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "The checks passed in run $run for $GITHUB_SHA: https://github.com/$GH_REPO/actions/runs/$run" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "checks=needed" >> "$GITHUB_OUTPUT"
            echo "No run of the checks passed for $GITHUB_SHA within a day: the source and official flavours run before the release." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: What the branch's last run left unfinished
        # A failed or cancelled check job runs again on the next push whatever
        # that push touches; an unreadable answer means everything runs.
        id: leftovers
        if: github.event_name != 'workflow_dispatch' || steps.evidence.outputs.checks != 'passed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if ! redo="$(scripts/release/last-run-failures.sh openreaction.yml "$BRANCH")"; then redo=ALL; fi
          { echo "redo<<REDO"; echo "$redo"; echo "REDO"; } >> "$GITHUB_OUTPUT"
      - name: Classify the change
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          EVIDENCE: ${{ steps.evidence.outputs.checks }}
          REDO: ${{ steps.leftovers.outputs.redo }}
          PLAN: ${{ runner.temp }}/plan.txt
          FLAVOURS: source licensed official
        run: |
          mode=""; base=""
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) if [ "$EVIDENCE" = passed ]; then mode=--nothing; else mode=--fallback; fi ;;
            pull_request) base="$BASE" ;;
            push) case "$GITHUB_REF" in refs/tags/*) mode=--all ;; *) base="$BEFORE" ;; esac ;;
            *) mode=--all ;;
          esac
          if [ "$REDO" = ALL ]; then mode=--all; fi
          if [ -z "$mode" ]; then
            # A new branch, or a force-push whose previous commit is gone, has no commit to diff against.
            if [ -n "$base" ] && ! printf '%s' "$base" | grep -Eq '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git diff --name-only "$base" "$GITHUB_SHA" | scripts/release/changes.sh openreaction --diff "$FLAVOURS" "$REDO" | tee -a "$GITHUB_OUTPUT" "$PLAN"
            else
              mode=--all
            fi
          fi
          if [ -n "$mode" ]; then scripts/release/changes.sh openreaction "$mode" "$FLAVOURS" "$REDO" | tee -a "$GITHUB_OUTPUT" "$PLAN"; fi
      - name: Record the plan
        # What this run checks, for a later manual run to read back
        # (scripts/release/checks-passed.sh): a job this plan left out was
        # skipped by design; any other skip is no evidence.
        uses: actions/upload-artifact@v4
        with:
          name: preflight
          path: ${{ runner.temp }}/plan.txt
          retention-days: 7

  # One leg per flavour the change calls for, in parallel. Each leg builds
  # its flavour with its tests from a cached build directory; the source
  # flavour runs the whole suite, the official flavour the suites that read
  # the flavour (scripts/flavour-tests.txt), the licensed flavour runs those
  # too, and the official flavour then builds the ad-hoc development app.
  checks:
    needs: preflight
    if: needs.preflight.outputs.flavours != '[]'
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.preflight.outputs.flavours) }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCRATCH_PATH: .build/${{ matrix.flavour }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The history, for the commit times the cached build is keyed on.
          fetch-depth: 0
      - name: Select Xcode 26
        id: xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "Xcode 26 (macOS 26 SDK) is required."; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
          echo "swift=$(swift --version 2>&1 | sed -nE 's/.*swiftlang-([0-9.]+).*/\1/p' | head -1)" >> "$GITHUB_OUTPUT"
      - name: Set the flavour
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          # The flavour's build environment (Package.swift, scripts/bundle.sh).
          case "$FLAVOUR" in
            source) licensing=0; official=0 ;;
            licensed) licensing=1; official=0 ;;
            official) licensing=1; official=1 ;;
            *) echo "Unknown flavour $FLAVOUR"; exit 1 ;;
          esac
          {
            echo "OPENAPPS_LICENSING=$licensing"
            echo "OPENAPPS_OFFICIAL=$official"
            echo "OPENAPPS_DODO_ENV=test"
            echo "OPENAPPS_DODO_PAID_PRODUCT_ID=$PLACEHOLDER_PAID_PRODUCT_ID"
          } >> "$GITHUB_ENV"
      - name: Restore the build directory
        # Keyed by flavour, toolchain and the package manifests; the newest
        # cache for the flavour is restored when nothing matches exactly, and
        # every run saves its own so the next one starts from this build.
        uses: actions/cache@v4
        with:
          path: apps/openreaction/.build
          key: openreaction-${{ matrix.flavour }}-${{ steps.xcode.outputs.swift }}-${{ hashFiles('apps/openreaction/Package.swift', 'packages/openapps-licensing/Package.swift', 'packages/openapps-updater/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            openreaction-${{ matrix.flavour }}-${{ steps.xcode.outputs.swift }}-${{ hashFiles('apps/openreaction/Package.swift', 'packages/openapps-licensing/Package.swift', 'packages/openapps-updater/Package.swift') }}-
            openreaction-${{ matrix.flavour }}-${{ steps.xcode.outputs.swift }}-
      - name: Restore the sources' commit times
        # A checkout stamps every file with now and the cached build would
        # rebuild everything; files unchanged since the cache's own commit
        # (the marker it carries) get their commit times back, changed ones
        # keep now, so nothing stale is ever reused.
        working-directory: .
        run: scripts/release/restore-mtimes.sh apps/openreaction/.build/openapps-cache-commit apps/openreaction packages/openapps-licensing packages/openapps-updater
      - name: Generate the licensing configuration
        if: env.OPENAPPS_LICENSING == '1'
        run: scripts/generate-licensing-config.sh Sources/OpenReaction/Licensing/LicensingConfig.swift
      - name: Build the ${{ matrix.flavour }} flavour with its tests
        run: swift build --build-tests --scratch-path "$SCRATCH_PATH"
      # Only suites that never post CGEvents or install an event tap run here:
      # the whole core library and the gate runner shutdown suite.
      # KeyboardTapTests and anything else that touches real input stay out
      # of CI. The licensing rules, stores and clients (the preferences
      # journal included) are tested with their package below.
      - name: Run the suites CI can
        if: matrix.flavour == 'source' && needs.preflight.outputs.suite == 'true'
        run: swift test --skip-build --scratch-path "$SCRATCH_PATH" --filter 'OpenReactionCoreTests|OpenReactionTests.GateRunnerShutdownTests'
      - name: Run the suites that read the flavour
        # In every flavour but source: the isolation, licensing and updater
        # assertions differ per flavour and gate every push.
        if: matrix.flavour != 'source' && needs.preflight.outputs.flavour_suite == 'true'
        run: |
          filter="$(../../scripts/release/test-filter.sh scripts/flavour-tests.txt)"
          selected="$(swift test list --skip-build --scratch-path "$SCRATCH_PATH" | grep -Ec "$filter" || true)"
          if [ "$selected" = 0 ]; then echo "scripts/flavour-tests.txt selects no test ($filter)."; exit 1; fi
          echo "Running $selected tests: $filter"
          swift test --skip-build --scratch-path "$SCRATCH_PATH" --filter "$filter"
      # The official flavour (licensing and the updater) as an ad-hoc signed
      # development app, against Dodo test mode with the placeholder ID and
      # a throwaway update key so the build does not depend on the real key;
      # it verifies like a release except for the signature and the live
      # configuration.
      - name: Build an ad-hoc signed official development app
        if: matrix.flavour == 'official' && needs.preflight.outputs.bundle == 'true'
        env:
          UNIVERSAL: "1"
        run: |
          UPDATE_PUBLIC_ED_KEY="$(xcrun swift -e 'import CryptoKit; print(Curve25519.Signing.PrivateKey().publicKey.rawRepresentation.base64EncodedString())')"
          export UPDATE_PUBLIC_ED_KEY
          scripts/bundle.sh
          scripts/make-zip.sh
          scripts/verify-release.sh dist/OpenReaction-*.zip
      - name: Remove the generated licensing configuration
        # Generated, gitignored and outside the cached build directory; removed
        # all the same so nothing of the placeholder outlives the job.
        if: always()
        run: rm -f Sources/OpenReaction/Licensing/LicensingConfig.swift
      - uses: actions/upload-artifact@v4
        if: matrix.flavour == 'official' && needs.preflight.outputs.bundle == 'true'
        with:
          name: OpenReaction-development-unsigned
          path: apps/openreaction/dist/*.zip
          retention-days: 7
          if-no-files-found: error

  # The shared packages' own suites, when a package changed.
  packages:
    needs: preflight
    if: needs.preflight.outputs.licensing_tests == 'true' || needs.preflight.outputs.updater_tests == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Xcode 26
        id: xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "Xcode 26 (macOS 26 SDK) is required."; exit 1; fi
          sudo xcode-select -s "$xcode"
          echo "swift=$(swift --version 2>&1 | sed -nE 's/.*swiftlang-([0-9.]+).*/\1/p' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            packages/openapps-licensing/.build
            packages/openapps-updater/.build
          key: packages-${{ steps.xcode.outputs.swift }}-${{ hashFiles('packages/openapps-licensing/Package.swift', 'packages/openapps-updater/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            packages-${{ steps.xcode.outputs.swift }}-${{ hashFiles('packages/openapps-licensing/Package.swift', 'packages/openapps-updater/Package.swift') }}-
            packages-${{ steps.xcode.outputs.swift }}-
      - run: scripts/release/restore-mtimes.sh packages/openapps-licensing/.build/openapps-cache-commit packages/openapps-licensing packages/openapps-updater
      - name: Test the licensing package
        if: needs.preflight.outputs.licensing_tests == 'true'
        run: swift test --package-path packages/openapps-licensing
      - name: Test the updater package
        if: needs.preflight.outputs.updater_tests == 'true'
        run: swift test --package-path packages/openapps-updater

  # The scripts and this workflow, when they changed. OpenReaction's lint
  # runs the release-script tests too — the keychain wrapper, the install
  # script and the binary scan need macOS — so it stays on a macOS runner.
  lint:
    needs: preflight
    if: needs.preflight.outputs.lint == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint and test the release scripts
        run: |
          brew install shellcheck actionlint >/dev/null
          shellcheck apps/openreaction/scripts/*.sh apps/openreaction/scripts/tests/*.sh scripts/release/*.sh scripts/release/tests/*.sh packaging/homebrew/*.sh packaging/homebrew/tests/*.sh
          # The served install scripts are plain POSIX sh (RELEASES.md, "Install script").
          shellcheck -s sh apps/website/public/install/*
          actionlint .github/workflows/openreaction.yml .github/workflows/nightly.yml .github/workflows/site.yml
          apps/openreaction/scripts/tests/scan-binary.test.sh
          scripts/release/tests/with-signing-keychain.test.sh
          scripts/release/tests/install-script.test.sh
          scripts/release/tests/checks-passed.test.sh
          scripts/release/tests/changes.test.sh
          scripts/release/tests/restore-mtimes.test.sh
          packaging/homebrew/tests/bump-cask.test.sh

  # Builds, signs, verifies and packages the release. Read-only token: it
  # never touches tags, releases, the feed or the tap.
  release:
    # Only the canonical repository releases; a fork keeps the checks and
    # nothing else. The checks must have passed here, or been skipped because
    # preflight found a run that passed them; packages and lint may be
    # skipped on a manual run only (by that evidence, or by the fallback
    # plan) — never after a failure or a cancellation.
    if: |
      !cancelled() && github.repository == 'openappshq/openapps'
      && (startsWith(github.ref, 'refs/tags/openreaction-v') || github.event_name == 'workflow_dispatch')
      && needs.preflight.result == 'success'
      && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.preflight.outputs.checks == 'passed'))
      && (needs.packages.result == 'success' || (needs.packages.result == 'skipped' && github.event_name == 'workflow_dispatch'))
      && (needs.lint.result == 'success' || (needs.lint.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    needs: [preflight, checks, packages, lint]
    runs-on: macos-26
    timeout-minutes: 60
    environment: openreaction-release
    concurrency:
      group: openreaction-build-${{ github.event_name == 'push' && github.ref_name || inputs.version != '' && format('openreaction-v{0}', inputs.version) || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      commit: ${{ steps.version.outputs.commit }}
      # The digest of the zip as verified here, and the id of the artifact it
      # was uploaded as: later jobs trust these, not what they download.
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The tags too, for bundle.sh's version fallback (`git describe`).
          fetch-depth: 0
      - name: Record the checks this release relies on
        env:
          CHECKS: ${{ needs.preflight.outputs.checks }}
          CHECKS_RUN: ${{ needs.preflight.outputs.checks_run }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$CHECKS" = passed ]; then
            echo "Checks: relied on run $CHECKS_RUN, which passed for $GITHUB_SHA — https://github.com/$REPO/actions/runs/$CHECKS_RUN" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Checks: ran in this workflow run for $GITHUB_SHA." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "Xcode 26 (macOS 26 SDK) is required."; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          # A tag push always publishes; a manual run publishes only when asked,
          # whether it was started from a branch or from a release tag.
          if [ "$GITHUB_EVENT_NAME" = push ]; then publish=true; else publish="${INPUT_PUBLISH:-false}"; fi
          case "$GITHUB_REF" in
            refs/tags/openreaction-v*)
              version="${GITHUB_REF#refs/tags/openreaction-v}"
              if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$version" ]; then
                echo "This run is on tag $GITHUB_REF_NAME; leave the version input empty or set it to $version."; exit 1
              fi ;;
            *)
              version="$INPUT_VERSION"
              if [ -z "$version" ]; then echo "Give a version, or run from a openreaction-v* tag."; exit 1; fi ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be MAJOR.MINOR.PATCH (got '$version')."; exit 1
          fi
          if [ "openreaction-v$version" != "$RELEASE_TAG" ]; then
            echo "Internal error: resolved openreaction-v$version but this run is serialised as $RELEASE_TAG."; exit 1
          fi
          {
            echo "version=$version"
            echo "tag=openreaction-v$version"
            echo "publish=$publish"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building OpenReaction $version from $(git rev-parse HEAD) (publish: $publish)"
      - name: Check release configuration
        # Everything the release needs is checked up front, so a missing
        # secret fails here with its name and never produces a signed build
        # that cannot be published. The certificate and the read-only ruleset
        # token are repository secrets shared by every app; the update key and
        # the two publishing credentials are the environment's (RELEASES.md,
        # "Signing material"). Only public
        # material is committed: the pinned requirement and the update public
        # key must have been generated.
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
          FEED_COMMIT_TOKEN: ${{ secrets.FEED_COMMIT_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          OPENAPPS_DODO_PAID_PRODUCT_ID: ${{ vars.OPENAPPS_DODO_PAID_PRODUCT_ID }}
          OPENAPPS_BUY_URL: ${{ vars.OPENAPPS_BUY_URL }}
          OPENAPPS_SUPPORT_URL: ${{ vars.OPENAPPS_SUPPORT_URL }}
        run: |
          missing=0
          for name in RELEASE_SIGNING_P12 RELEASE_SIGNING_P12_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set as a repository secret."; missing=1; fi
          done
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then echo "::error::Secret SPARKLE_ED_PRIVATE_KEY is not set in the openreaction-release environment."; missing=1; fi
          # Only publication uses these, but a missing token should fail before a 30-minute build, not after.
          if [ "$PUBLISH" = true ]; then
            if [ -z "$RULESET_READ_TOKEN" ]; then echo "::error::Secret RULESET_READ_TOKEN is not set as a repository secret; publishing needs it."; missing=1; fi
            for name in FEED_COMMIT_TOKEN HOMEBREW_TAP_DEPLOY_KEY; do
              if [ -z "${!name}" ]; then echo "::error::Secret $name is not set in the openreaction-release environment; publishing needs it."; missing=1; fi
            done
          fi
          if [ -z "$OPENAPPS_DODO_PAID_PRODUCT_ID" ]; then
            echo "::error::Variable OPENAPPS_DODO_PAID_PRODUCT_ID is not set in the openreaction-release environment."; missing=1
          fi
          for file in release/designated-requirement.txt release/sparkle-public-key.txt; do
            if grep -q '^NOT GENERATED' "$file"; then
              echo "::error::$file has not been generated yet; create the release certificate and update key first (apps/openreaction/RELEASING.md, \"Signing certificate and update key\")."; missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          case "$OPENAPPS_DODO_PAID_PRODUCT_ID" in
            pdt_*) ;;
            *) echo "::error::OPENAPPS_DODO_PAID_PRODUCT_ID must be a Dodo product ID (pdt_…)."; exit 1 ;;
          esac
          # The generator validates the URLs' shape; this only reports what is configured.
          for name in OPENAPPS_BUY_URL OPENAPPS_SUPPORT_URL; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: not set (optional)"; fi
          done
      - name: Build, sign and verify the universal release
        # The identity lives in a temporary keychain for exactly this step;
        # with-signing-keychain.sh removes it before the step ends and fails
        # if it can still be found. bundle.sh signs with the pinned designated
        # requirement and refuses a certificate that does not produce it.
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          UNIVERSAL: "1"
          OPENAPPS_LICENSING: "1"
          OPENAPPS_OFFICIAL: "1"
          OPENAPPS_DODO_ENV: live
          OPENAPPS_DODO_PAID_PRODUCT_ID: ${{ vars.OPENAPPS_DODO_PAID_PRODUCT_ID }}
          OPENAPPS_BUY_URL: ${{ vars.OPENAPPS_BUY_URL }}
          OPENAPPS_SUPPORT_URL: ${{ vars.OPENAPPS_SUPPORT_URL }}
        run: ../../scripts/release/with-signing-keychain.sh scripts/bundle.sh
      - name: Confirm the signing identity is gone
        # Nothing after this point may sign: the zip, the feed, the upload and
        # the publish only need the update key and tokens.
        run: |
          if security find-identity -p codesigning 2>/dev/null | grep -q 'OpenApps HQ Release'; then
            echo "::error::The release signing identity is still available after the build."; exit 1
          fi
      - name: Zip, verify and sign the update
        id: package
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Feed verification needs OpenSSL 3 (Ed25519); macOS ships LibreSSL.
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          scripts/make-zip.sh
          scripts/verify-release.sh --release "dist/OpenReaction-$VERSION.zip"
          scripts/make-appcast.sh "dist/OpenReaction-$VERSION.zip"
          echo "sha256=$(cut -d' ' -f1 "dist/OpenReaction-$VERSION.zip.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: OpenReaction-${{ steps.version.outputs.version }}-signed
          path: |
            apps/openreaction/dist/*.zip
            apps/openreaction/dist/*.sha256
            apps/openreaction/dist/appcast.xml
          if-no-files-found: error

  # Publishes the verified zip. The only job with a token that can write
  # releases; it runs no build, only scripts/publish-release.sh, which
  # requires the openreaction-v* tag ruleset to be active with no bypass
  # actors and refuses unless the tag names exactly the commit the zip was
  # built from and the zip has exactly the digest the release job verified.
  publish:
    if: github.repository == 'openappshq/openapps' && needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openreaction-release
    # One publication at a time across all versions, so the newest-version
    # check and the final publish of two releases can never interleave.
    concurrency:
      group: openreaction-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          # By id, not by name: exactly the artifact the release job uploaded.
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: apps/openreaction/dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          BUILT_COMMIT: ${{ needs.release.outputs.commit }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          CREATE_TAG: ${{ github.event_name == 'workflow_dispatch' }}
          ALLOW_OLDER: ${{ inputs.allow_older == true }}
        run: scripts/publish-release.sh

  # Once the release is public: commit the signed feed and the install script
  # to main (the website deploy serves both), verify the live feed, zip and
  # script, then bump the cask.
  # No build runs here and no signing material is present; the feed was
  # signed by the release job and is only checked again here.
  feed:
    if: github.repository == 'openappshq/openapps'
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: openreaction-release
    concurrency:
      group: openreaction-publish
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: apps/openreaction/dist
          merge-multiple: true
      - name: Check the feed against the published release
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          cd apps/openreaction
          read -r version _ url sha256 < <(scripts/verify-appcast.sh dist/appcast.xml "dist/OpenReaction-$VERSION.zip")
          expected_url="https://github.com/openappshq/openapps/releases/download/openreaction-v$VERSION/OpenReaction-$VERSION.zip"
          if [ "$version" != "$VERSION" ] || [ "$sha256" != "$EXPECTED_SHA256" ] || [ "$url" != "$expected_url" ]; then
            echo "::error::dist/appcast.xml announces $version $sha256 at $url, not $VERSION $EXPECTED_SHA256 at $expected_url"; exit 1
          fi
      - name: Never move the stable feed backwards
        # The feed and the cask only ever advance. A back-port (allow_older)
        # is published as a GitHub Release and nothing else: installed apps
        # never downgrade anyway, and the cask refuses lower versions.
        id: order
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ALLOW_OLDER: ${{ inputs.allow_older == true }}
        run: |
          current=""
          if [ -f apps/website/public/updates/openreaction/appcast.xml ]; then
            read -r current _ < <(cd apps/openreaction && scripts/verify-appcast.sh ../website/public/updates/openreaction/appcast.xml)
          fi
          if [ -n "$current" ] && [ "$current" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" = "$current" ]; then
            if [ "$ALLOW_OLDER" != true ]; then
              echo "::error::The live feed is at $current, newer than $VERSION; a lower version is never promoted."; exit 1
            fi
            echo "::notice::$VERSION is a back-port below the live feed's $current: the release is published, the feed and the cask stay at $current."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the feed to main
        if: steps.order.outputs.promote == 'true'
        env:
          FEED_COMMIT_TOKEN: ${{ secrets.FEED_COMMIT_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p apps/website/public/updates/openreaction
          cp apps/openreaction/dist/appcast.xml apps/website/public/updates/openreaction/appcast.xml
          # The install script pins the same release as the feed (RELEASES.md,
          # "Install script"); write-install-script.sh refuses to move it backwards.
          scripts/release/write-install-script.sh openreaction OpenReaction "$VERSION" "$SHA256" apps/website/public/install/openreaction
          git config user.name "openapps-release"
          git config user.email "release@openapps.space"
          git add apps/website/public/updates/openreaction/appcast.xml apps/website/public/install/openreaction
          if git diff --cached --quiet; then echo "The feed and the install script already name $VERSION."; exit 0; fi
          git commit -m "Point OpenReaction's update feed and install script at $VERSION"
          # The token is passed per command and never written to .git/config.
          for _ in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FEED_COMMIT_TOKEN" | base64 | tr -d '\n')" push "https://github.com/$REPO.git" HEAD:main; then exit 0; fi
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FEED_COMMIT_TOKEN" | base64 | tr -d '\n')" pull --rebase "https://github.com/$REPO.git" main
          done
          echo "::error::Could not push the feed to main after 3 attempts."; exit 1
      - name: Verify the live feed and download
        if: steps.order.outputs.promote == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          # The website deploys from main after the commit above.
          WAIT_SECONDS: "1500"
        run: apps/openreaction/scripts/verify-live.sh "$VERSION" "$EXPECTED_SHA256"
      - name: Verify the live install script
        if: steps.order.outputs.promote == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
        run: scripts/release/verify-live-install-script.sh openreaction "$VERSION" "$EXPECTED_SHA256"
      - name: Bump the cask
        if: steps.order.outputs.promote == 'true'
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          # The tap is pushed with a deploy key that can write only to that repository.
          umask 077; install -d "$RUNNER_TEMP/tap-key"; printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap-key/id"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/tap-key/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap-key/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/tap-key/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/tap-key"' EXIT
          git clone --depth 1 git@github.com:openappshq/homebrew-tap.git tap
          mkdir -p tap/Casks
          if [ ! -f tap/Casks/openreaction.rb ]; then cp packaging/homebrew/Casks/openreaction.rb tap/Casks/openreaction.rb; fi
          packaging/homebrew/bump-cask.sh tap/Casks/openreaction.rb "$VERSION" "$SHA256"
          cd tap
          git config user.name "openapps-release"
          git config user.email "release@openapps.space"
          git add Casks/openreaction.rb
          if git diff --cached --quiet; then echo "The cask already names $VERSION."; exit 0; fi
          git commit -m "openreaction $VERSION"
          git push origin HEAD
