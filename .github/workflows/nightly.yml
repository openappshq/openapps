name: Nightly

# Every app's full suite in every flavour, heavy tests included, once a
# night (RELEASES.md, "Pipeline"). The checks that gate a push run the
# suite once, in the source flavour, without the tests marked heavy and
# only the flavour-specific suites in the official flavour; this is where
# the rest runs. A failure opens (or adds to) the issue labelled `nightly`
# — the ping — besides GitHub's own e-mail for a failed scheduled run.
on:
  schedule:
    # 03:00 UTC, after the day's releases and before the next morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  swift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: macpaper, module: MacPaper, flavour: source }
          - { app: macpaper, module: MacPaper, flavour: licensed }
          - { app: macpaper, module: MacPaper, flavour: official }
          - { app: macpaper, module: MacPaper, flavour: update-test }
          - { app: opennotes, module: OpenNotes, flavour: source }
          - { app: opennotes, module: OpenNotes, flavour: licensed }
          - { app: opennotes, module: OpenNotes, flavour: official }
          - { app: opennotes, module: OpenNotes, flavour: update-test }
          - { app: hertz, module: Hertz, flavour: source }
          - { app: hertz, module: Hertz, flavour: official }
          # Only suites that never post CGEvents or install an event tap
          # (openreaction.yml); the filter is the same there.
          - { app: openreaction, module: OpenReaction, flavour: source, filter: "OpenReactionCoreTests|OpenReactionTests.GateRunnerShutdownTests" }
          - { app: openreaction, module: OpenReaction, flavour: licensed, filter: "OpenReactionCoreTests|OpenReactionTests.GateRunnerShutdownTests" }
          - { app: openreaction, module: OpenReaction, flavour: official, filter: "OpenReactionCoreTests|OpenReactionTests.GateRunnerShutdownTests" }
    name: ${{ matrix.app }} (${{ matrix.flavour }})
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "Xcode 26 (macOS 26 SDK) is required."; exit 1; fi
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Set the flavour
        env:
          FLAVOUR: ${{ matrix.flavour }}
          APP: ${{ matrix.app }}
          MODULE: ${{ matrix.module }}
        run: |
          case "$FLAVOUR" in
            source) licensing=0; official=0 ;;
            licensed) licensing=1; official=0 ;;
            official) licensing=1; official=1 ;;
            update-test) licensing=0; official=1; echo "$(echo "$MODULE" | tr '[:lower:]' '[:upper:]')_UPDATE_TEST=1" >> "$GITHUB_ENV" ;;
            *) echo "Unknown flavour $FLAVOUR"; exit 1 ;;
          esac
          {
            echo "OPENAPPS_LICENSING=$licensing"
            echo "OPENAPPS_OFFICIAL=$official"
            echo "OPENAPPS_DODO_ENV=test"
            # The placeholder the app's own checks use; never published.
            echo "OPENAPPS_DODO_PAID_PRODUCT_ID=pdt_placeholder_$APP"
          } >> "$GITHUB_ENV"
      - name: Generate the licensing configuration
        if: env.OPENAPPS_LICENSING == '1'
        env:
          MODULE: ${{ matrix.module }}
        run: scripts/generate-licensing-config.sh "Sources/$MODULE/Licensing/LicensingConfig.swift"
      - name: Run the whole suite, heavy tests included
        env:
          FILTER: ${{ matrix.filter }}
        run: swift test --scratch-path ".build/${{ matrix.flavour }}" ${FILTER:+--filter "$FILTER"}
      - name: Remove the generated licensing configuration
        if: always()
        env:
          MODULE: ${{ matrix.module }}
        run: rm -f "Sources/$MODULE/Licensing/LicensingConfig.swift"

  packages:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "Xcode 26 (macOS 26 SDK) is required."; exit 1; fi
          sudo xcode-select -s "$xcode"
      - run: swift test --package-path packages/openapps-licensing
      - run: swift test --package-path packages/openapps-updater

  openklack:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MANIFEST: apps/openklack-desktop/src-tauri/Cargo.toml
      OPENKLACK_LICENSE_ENV: test
      OPENKLACK_DODO_PAID_PRODUCT_ID: pdt_placeholder_openklack
      OPENKLACK_BUY_URL: https://checkout.dodopayments.com/buy/pdt_placeholder_openklack?quantity=1&redirect_url=https://openapps.space/OpenKlack/thanks/
      OPENKLACK_TRIAL_REGISTRY_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - run: rustup default "$RUST_TOOLCHAIN"
      - name: Test every feature set
        # The tests marked #[ignore] need a registry stub or an audio
        # output and stay ignored here too.
        run: |
          for features in "" updater licensing licensing,updater; do
            echo "==> features: ${features:-none}"
            cargo test --locked --manifest-path "$MANIFEST" ${features:+--features "$features"}
          done

  # The ping: one open issue labelled `nightly` collects the failures.
  report:
    needs: [swift, packages, openklack]
    if: always() && (needs.swift.result != 'success' || needs.packages.result != 'success' || needs.openklack.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: "swift: ${{ needs.swift.result }}, packages: ${{ needs.packages.result }}, openklack: ${{ needs.openklack.result }}"
        run: |
          gh label create nightly --description "The nightly full-suite run failed" --color B60205 2>/dev/null || true
          body="Nightly run $RUN_URL failed ($RESULTS) at $(date -u +%Y-%m-%dT%H:%MZ) on $GITHUB_SHA."
          number="$(gh issue list --label nightly --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Nightly checks failed" --label nightly --body "$body"$'\n\n'"Close this once the run is green again (RELEASES.md, \"Pipeline\")."
          fi
