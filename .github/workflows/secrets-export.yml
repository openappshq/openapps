name: Secrets export (temporary)

# One-off, temporary: exports the five release secrets every app shares out
# of the hertz-release environment so they can be stored as repository
# secrets (GitHub cannot read a secret back). The values leave the runner
# only inside an age-encrypted tar addressed to the public key given as the
# input; the private half never leaves the operator's machine. This file is
# removed in the commit after the export has been done.
on:
  workflow_dispatch:
    inputs:
      age_recipient:
        description: The age public key (age1…) the export is encrypted to
        type: string
        required: true

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'openappshq/openapps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hertz-release
    permissions:
      contents: read
    steps:
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null && age --version
      - name: Encrypt the secrets
        env:
          AGE_RECIPIENT: ${{ inputs.age_recipient }}
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          FEED_COMMIT_TOKEN: ${{ secrets.FEED_COMMIT_TOKEN }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          case "$AGE_RECIPIENT" in
            age1*) ;;
            *) echo "::error::age_recipient must be an age public key (age1…)."; exit 1 ;;
          esac
          work="$(mktemp -d)"
          mkdir "$work/secrets"
          for name in RELEASE_SIGNING_P12 RELEASE_SIGNING_P12_PASSWORD HOMEBREW_TAP_DEPLOY_KEY FEED_COMMIT_TOKEN RULESET_READ_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set in the hertz-release environment."; exit 1; fi
            printf '%s' "${!name}" > "$work/secrets/$name"
            echo "$name: $(wc -c < "$work/secrets/$name") bytes"
          done
          tar -C "$work" -cf "$work/secrets.tar" secrets
          mkdir -p export
          age -r "$AGE_RECIPIENT" -o export/secrets.tar.age "$work/secrets.tar"
          rm -rf "$work"
          echo "secrets.tar.age: $(wc -c < export/secrets.tar.age) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-export
          path: export/secrets.tar.age
          retention-days: 1
          if-no-files-found: error
