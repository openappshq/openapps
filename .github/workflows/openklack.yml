name: OpenKlack desktop

# Checks on every change; a signed universal release when an
# `openklack-v<MAJOR.MINOR.PATCH>` tag is pushed (or on manual dispatch, which
# publishes only when asked). The release follows RELEASES.md: build, sign
# with the stable OpenApps HQ Release certificate, verify the pinned
# designated requirement, package and update-sign, publish the GitHub
# Release, commit the signed feed to main, verify it live, bump the cask.
# Setup and secrets: docs/development.md, "Releases and updates".
#
# The checks run what the change touches and nothing more (RELEASES.md,
# "Pipeline"): a preflight job classifies the diff and, on a manual run,
# looks for a run of these checks that already passed for this commit; the
# Rust flavours then test and lint in parallel from a cached target
# directory, and the development app builds in its own leg. The JavaScript
# workspace (lint, tests, the design check, the website build) is checked
# by site.yml, which the same files trigger.
#
# The paths filter applies to branch pushes and pull requests; tag pushes
# always run, which is what the release needs. Markdown never triggers.
on:
  pull_request:
    paths:
      - apps/openklack-desktop/**
      - packages/openklack-ui/**
      - packages/keyboard-layout/**
      - packages/soundpacks/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - tsconfig.json
      - vite.config.ts
      - scripts/release/**
      - packaging/homebrew/**
      - .github/workflows/openklack.yml
      - .github/rulesets/openklack-release-tags.json
      - "!**/*.md"
  push:
    branches: [main, pipeline-fast-checks]
    tags: [openklack-v*]
    paths:
      - apps/openklack-desktop/**
      - packages/openklack-ui/**
      - packages/keyboard-layout/**
      - packages/soundpacks/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - tsconfig.json
      - vite.config.ts
      - scripts/release/**
      - packaging/homebrew/**
      - .github/workflows/openklack.yml
      - .github/rulesets/openklack-release-tags.json
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build as MAJOR.MINOR.PATCH (ignored when running from an openklack-v* tag)
        type: string
        default: ""
      publish:
        description: Publish the release (creates the openklack-v<version> tag at this commit if it does not exist), then the feed and the cask
        type: boolean
        default: false
      allow_older:
        description: Allow publishing a version lower than the newest published release (a back-port)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PNPM_VERSION: 12.4.1
  RUST_TOOLCHAIN: 1.97.1
  # The release tag this run is about: the pushed tag, or openklack-v<input>
  # on a manual run from a branch. Build and publish serialise per tag.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version != '' && format('openklack-v{0}', inputs.version) || github.ref_name }}

jobs:
  # What this run has to check. On a manual run, first whether a run of
  # these checks already passed for this commit (scripts/release/checks-passed.sh);
  # then which legs the change calls for (scripts/release/changes.sh).
  # A push or pull request never relies on an earlier run.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.evidence.outputs.checks }}
      checks_run: ${{ steps.evidence.outputs.run }}
      flavours: ${{ steps.changes.outputs.flavours }}
      lint: ${{ steps.changes.outputs.lint }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The history, to diff against the previous push.
          fetch-depth: 0
      - name: Look for a passed run of these checks
        id: evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if run="$(scripts/release/checks-passed.sh openklack.yml "$GITHUB_SHA")"; then
            echo "checks=passed" >> "$GITHUB_OUTPUT"
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "The checks passed in run $run for $GITHUB_SHA: https://github.com/$GH_REPO/actions/runs/$run" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "checks=needed" >> "$GITHUB_OUTPUT"
            echo "No run of the checks passed for $GITHUB_SHA within a day: the source and official flavours run before the release." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Classify the change
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          EVIDENCE: ${{ steps.evidence.outputs.checks }}
          # source, licensed, official and update-test are the Cargo feature
          # sets (none, licensing, licensing+updater, updater); app is the
          # development build.
          FLAVOURS: source licensed official update-test app
        run: |
          mode=""; base=""
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) if [ "$EVIDENCE" = passed ]; then mode=--nothing; else mode=--fallback; fi ;;
            pull_request) base="$BASE" ;;
            push) case "$GITHUB_REF" in refs/tags/*) mode=--all ;; *) base="$BEFORE" ;; esac ;;
            *) mode=--all ;;
          esac
          if [ -z "$mode" ]; then
            # A new branch or a force-push has no previous commit to diff against.
            if [ -n "$base" ] && ! printf '%s' "$base" | grep -Eq '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git diff --name-only "$base" "$GITHUB_SHA" | scripts/release/changes.sh openklack --diff "$FLAVOURS" | tee -a "$GITHUB_OUTPUT"
            else
              mode=--all
            fi
          fi
          if [ -n "$mode" ]; then scripts/release/changes.sh openklack "$mode" "$FLAVOURS" | tee -a "$GITHUB_OUTPUT"; fi

  # One leg per Cargo feature set the change calls for, plus the development
  # app, in parallel, each from a cached target directory. The source leg
  # also checks formatting; the licensed legs test against a fake Dodo
  # client and a fake trial registry with placeholder configuration.
  checks:
    needs: preflight
    if: needs.preflight.outputs.flavours != '[]'
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.preflight.outputs.flavours) }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MANIFEST: apps/openklack-desktop/src-tauri/Cargo.toml
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The history, for the commit times the cached build is keyed on.
          fetch-depth: 0
      - name: Set the flavour
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          case "$FLAVOUR" in
            source) features="" ;;
            licensed) features="licensing" ;;
            official) features="licensing,updater" ;;
            update-test) features="updater" ;;
            app) features="" ;;
            *) echo "Unknown flavour $FLAVOUR"; exit 1 ;;
          esac
          echo "FEATURES=$features" >> "$GITHUB_ENV"
          case "$features" in
            *licensing*)
              # Placeholder configuration: the shared test cases run against a fake Dodo client and a fake trial registry.
              {
                echo "OPENKLACK_LICENSE_ENV=test"
                echo "OPENKLACK_DODO_PAID_PRODUCT_ID=pdt_placeholder_openklack"
                echo "OPENKLACK_BUY_URL=https://checkout.dodopayments.com/buy/pdt_placeholder_openklack?quantity=1&redirect_url=https://openapps.space/OpenKlack/thanks/"
                echo "OPENKLACK_TRIAL_REGISTRY_URL=http://127.0.0.1:8787"
              } >> "$GITHUB_ENV" ;;
          esac
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - run: rustup default "$RUST_TOOLCHAIN"
      - name: Restore the target directory
        # One cache for every leg, keyed by toolchain and the lock file: a
        # target directory holds every feature set side by side and is a
        # gigabyte compressed, so the legs share it rather than each saving
        # their own. The newest cache is restored when nothing matches
        # exactly; the first leg to finish saves this commit's, the others
        # find it saved, and the feature sets accumulate over a few runs.
        # Incremental state is machine-bound and left out.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/openklack-desktop/src-tauri/target
            !apps/openklack-desktop/src-tauri/target/**/incremental
          key: openklack-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('apps/openklack-desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            openklack-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('apps/openklack-desktop/src-tauri/Cargo.lock') }}-
            openklack-cargo-${{ env.RUST_TOOLCHAIN }}-
      - name: Restore the sources' commit times
        run: scripts/release/restore-mtimes.sh apps/openklack-desktop
      - name: Check formatting
        if: matrix.flavour == 'source'
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - name: Test and lint the ${{ matrix.flavour }} flavour
        if: matrix.flavour != 'app'
        run: |
          cargo test --locked --manifest-path "$MANIFEST" ${FEATURES:+--features "$FEATURES"}
          cargo clippy --locked --manifest-path "$MANIFEST" --all-targets ${FEATURES:+--features "$FEATURES"} -- -D warnings
      - uses: actions/setup-node@v6
        if: matrix.flavour == 'app'
        with:
          node-version: 24
      - name: Build the development app
        if: matrix.flavour == 'app'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          pnpm install --frozen-lockfile
          pnpm --filter @openapps/openklack-desktop tauri build --debug --bundles app
          ditto -c -k --sequesterRsrc --keepParent apps/openklack-desktop/src-tauri/target/debug/bundle/macos/OpenKlack.app OpenKlack-development.zip
      - uses: actions/upload-artifact@v4
        if: matrix.flavour == 'app'
        with:
          name: OpenKlack-development-apple-silicon
          path: OpenKlack-development.zip
          retention-days: 7

  # The scripts and this workflow, when they changed. Static checks only, so
  # a Linux runner does; the keychain wrapper's own test, which needs macOS,
  # runs in openreaction.yml.
  lint:
    needs: preflight
    if: needs.preflight.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install shellcheck and actionlint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint && sudo install actionlint /usr/local/bin/actionlint && rm actionlint actionlint.tar.gz
      - name: Lint and test the release scripts
        run: |
          shellcheck scripts/release/*.sh scripts/release/tests/*.sh apps/openklack-desktop/release/*.sh packaging/homebrew/bump-cask.sh
          actionlint .github/workflows/openklack.yml
          scripts/release/tests/checks-passed.test.sh
          scripts/release/tests/changes.test.sh
          packaging/homebrew/tests/bump-cask.test.sh

  # Builds, signs, verifies and packages the release. Read-only token: it
  # never touches tags, releases, the feed or the tap.
  release:
    # Only the canonical repository releases; a fork keeps the checks and
    # nothing else. Every check job must have passed or been skipped by
    # preflight — a run that relied on an earlier passed run, or a change
    # that called for less — never failed or cancelled.
    if: |
      !cancelled() && github.repository == 'openappshq/openapps'
      && (startsWith(github.ref, 'refs/tags/openklack-v') || github.event_name == 'workflow_dispatch')
      && needs.preflight.result == 'success'
      && (needs.checks.result == 'success' || needs.checks.result == 'skipped')
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    needs: [preflight, checks, lint]
    runs-on: macos-15
    timeout-minutes: 90
    environment: openklack-release
    concurrency:
      group: openklack-build-${{ github.event_name == 'push' && github.ref_name || inputs.version != '' && format('openklack-v{0}', inputs.version) || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      commit: ${{ steps.version.outputs.commit }}
      build: ${{ steps.version.outputs.build }}
      # The digest of the zip as verified here, and the id of the artifact it
      # was uploaded as: later jobs trust these, not what they download.
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
        working-directory: apps/openklack-desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Full history: the build number is the commit count on HEAD.
          fetch-depth: 0
      - name: Record the checks this release relies on
        env:
          CHECKS: ${{ needs.preflight.outputs.checks }}
          CHECKS_RUN: ${{ needs.preflight.outputs.checks_run }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$CHECKS" = passed ]; then
            echo "Checks: relied on run $CHECKS_RUN, which passed for $GITHUB_SHA — https://github.com/$REPO/actions/runs/$CHECKS_RUN" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Checks: ran in this workflow run for $GITHUB_SHA." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global "pnpm@$PNPM_VERSION"
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup default "$RUST_TOOLCHAIN"
      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          # A tag push always publishes; a manual run publishes only when asked.
          if [ "$GITHUB_EVENT_NAME" = push ]; then publish=true; else publish="${INPUT_PUBLISH:-false}"; fi
          case "$GITHUB_REF" in
            refs/tags/openklack-v*)
              version="${GITHUB_REF#refs/tags/openklack-v}"
              if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$version" ]; then
                echo "This run is on tag $GITHUB_REF_NAME; leave the version input empty or set it to $version."; exit 1
              fi ;;
            *)
              version="$INPUT_VERSION"
              if [ -z "$version" ]; then echo "Give a version, or run from an openklack-v* tag."; exit 1; fi ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be MAJOR.MINOR.PATCH (got '$version')."; exit 1
          fi
          if [ "openklack-v$version" != "$RELEASE_TAG" ]; then
            echo "Internal error: resolved openklack-v$version but this run is serialised as $RELEASE_TAG."; exit 1
          fi
          {
            echo "version=$version"
            echo "tag=openklack-v$version"
            echo "publish=$publish"
            echo "commit=$(git rev-parse HEAD)"
            echo "build=$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building OpenKlack $version from $(git rev-parse HEAD) (publish: $publish)"
      - name: Check release configuration
        # Everything the release needs is checked up front, so a missing
        # secret fails here with its name and never produces a signed build
        # that cannot be published. The certificate and the read-only ruleset
        # token are repository secrets shared by every app; the update key and
        # the two publishing credentials are the environment's (RELEASES.md,
        # "Signing material"). Only public
        # material is committed: the pinned requirement and update public key
        # must have been generated.
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
          FEED_COMMIT_TOKEN: ${{ secrets.FEED_COMMIT_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          OPENKLACK_DODO_PAID_PRODUCT_ID: ${{ vars.OPENKLACK_DODO_PAID_PRODUCT_ID }}
          OPENKLACK_BUY_URL: ${{ vars.OPENKLACK_BUY_URL }}
        run: |
          missing=0
          for name in RELEASE_SIGNING_P12 RELEASE_SIGNING_P12_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set as a repository secret."; missing=1; fi
          done
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set in the openklack-release environment."; missing=1; fi
          if [ "$PUBLISH" = true ]; then
            if [ -z "$RULESET_READ_TOKEN" ]; then echo "::error::Secret RULESET_READ_TOKEN is not set as a repository secret; publishing needs it."; missing=1; fi
            for name in FEED_COMMIT_TOKEN HOMEBREW_TAP_DEPLOY_KEY; do
              if [ -z "${!name}" ]; then echo "::error::Secret $name is not set in the openklack-release environment; publishing needs it."; missing=1; fi
            done
          fi
          for name in OPENKLACK_DODO_PAID_PRODUCT_ID OPENKLACK_BUY_URL; do
            if [ -z "${!name}" ]; then echo "::error::Variable $name is not set in the openklack-release environment."; missing=1; fi
          done
          for file in release/designated-requirement.txt release/updater-public-key.txt; do
            if grep -q '^NOT GENERATED' "$file"; then echo "::error::$file has not been generated yet (RELEASES.md)."; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          case "$OPENKLACK_DODO_PAID_PRODUCT_ID" in pdt_*) ;; *) echo "::error::OPENKLACK_DODO_PAID_PRODUCT_ID must be a Dodo product ID (pdt_…)."; exit 1 ;; esac
          case "$OPENKLACK_BUY_URL" in https://*) ;; *) echo "::error::OPENKLACK_BUY_URL must be an https:// link."; exit 1 ;; esac
      - name: Build, sign and verify the universal app
        # The identity lives in a temporary keychain for exactly this step;
        # with-signing-keychain.sh removes it before the step ends and fails
        # if it can still be found. Verification of the designated requirement
        # happens inside build-signed.sh, before that removal.
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_DIR: src-tauri/target/universal-apple-darwin/release/bundle/macos
          OPENKLACK_LICENSE_ENV: live
          OPENKLACK_DODO_PAID_PRODUCT_ID: ${{ vars.OPENKLACK_DODO_PAID_PRODUCT_ID }}
          OPENKLACK_BUY_URL: ${{ vars.OPENKLACK_BUY_URL }}
          OPENKLACK_SUPPORT_URL: ${{ vars.OPENKLACK_SUPPORT_URL }}
        run: ../../scripts/release/with-signing-keychain.sh release/build-signed.sh "$VERSION" --target universal-apple-darwin
      - name: Confirm the signing identity is gone
        run: |
          if security find-identity -p codesigning 2>/dev/null | grep -q 'OpenApps HQ Release'; then
            echo "::error::The release signing identity is still available after the build."; exit 1
          fi
          lipo -archs "src-tauri/target/universal-apple-darwin/release/bundle/macos/OpenKlack.app/Contents/MacOS/openklack-desktop" | tee /dev/stderr | grep -q 'x86_64 arm64'
      - name: Package and sign the update
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          release/package.sh src-tauri/target/universal-apple-darwin/release/bundle/macos "$VERSION" dist
          release/write-feed.sh "$VERSION" dist dist/feed
          echo "sha256=$(cut -d' ' -f1 "dist/OpenKlack-$VERSION.zip.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: OpenKlack-${{ steps.version.outputs.version }}-signed
          path: apps/openklack-desktop/dist
          if-no-files-found: error

  # Publishes the verified files. The only job with a token that can write
  # releases; it runs no build, only release/publish-release.sh, which
  # requires the openklack-v* tag ruleset to be active with no bypass actors
  # and refuses unless the tag names exactly the commit the files were built
  # from and the zip has exactly the digest the release job verified.
  publish:
    if: github.repository == 'openappshq/openapps' && needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openklack-release
    concurrency:
      group: openklack-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          # By id, not by name: exactly the artifact the release job uploaded.
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: apps/openklack-desktop/dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          BUILT_COMMIT: ${{ needs.release.outputs.commit }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          CREATE_TAG: ${{ github.event_name == 'workflow_dispatch' }}
          ALLOW_OLDER: ${{ inputs.allow_older == true }}
          DIST: apps/openklack-desktop/dist
        run: apps/openklack-desktop/release/publish-release.sh

  # Once the release is public: commit the signed feed and the install script
  # to main (the website deploy serves both), verify the live feed, zip and
  # script, then bump the cask.
  # No build runs here and no signing material is present.
  feed:
    if: github.repository == 'openappshq/openapps'
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: openklack-release
    concurrency:
      group: openklack-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: apps/openklack-desktop/dist
          merge-multiple: true
      - name: Check the feed against the published release
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          cd apps/openklack-desktop
          node release/verify-update-signature.mjs dist/feed/latest.json dist/feed/latest.json.sig
          node --input-type=module - <<'JS'
          import { readFileSync } from "node:fs";
          const feed = JSON.parse(readFileSync("dist/feed/latest.json", "utf8"));
          const { VERSION, EXPECTED_SHA256 } = process.env;
          if (feed.version !== VERSION || feed.sha256 !== EXPECTED_SHA256) {
            throw new Error(`dist/feed/latest.json names ${feed.version} ${feed.sha256}, not ${VERSION} ${EXPECTED_SHA256}`);
          }
          JS
      - name: Never move the stable feed backwards
        # The feed, the install script and the cask only ever advance. A
        # back-port (allow_older) is published as a GitHub Release and nothing
        # else: installed apps never downgrade anyway, and the cask and the
        # install script refuse lower versions.
        id: order
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ALLOW_OLDER: ${{ inputs.allow_older == true }}
        run: |
          current=""
          if [ -f apps/website/public/updates/openklack/latest.json ]; then
            current="$(node -e 'const feed = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(String(feed.version ?? ""))' apps/website/public/updates/openklack/latest.json)"
          fi
          if [ -n "$current" ] && [ "$current" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" = "$current" ]; then
            if [ "$ALLOW_OLDER" != true ]; then
              echo "::error::The live feed is at $current, newer than $VERSION; a lower version is never promoted."; exit 1
            fi
            echo "::notice::$VERSION is a back-port below the live feed's $current: the release is published, the feed, the install script and the cask stay at $current."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the feed to main
        if: steps.order.outputs.promote == 'true'
        env:
          FEED_COMMIT_TOKEN: ${{ secrets.FEED_COMMIT_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p apps/website/public/updates/openklack
          cp apps/openklack-desktop/dist/feed/latest.json apps/openklack-desktop/dist/feed/latest.json.sig apps/website/public/updates/openklack/
          # The install script pins the same release as the feed (RELEASES.md,
          # "Install script"); write-install-script.sh refuses to move it backwards.
          scripts/release/write-install-script.sh openklack OpenKlack "$VERSION" "$SHA256" apps/website/public/install/openklack
          git config user.name "openapps-release"
          git config user.email "release@openapps.space"
          git add apps/website/public/updates/openklack/latest.json apps/website/public/updates/openklack/latest.json.sig apps/website/public/install/openklack
          if git diff --cached --quiet; then echo "The feed and the install script already name $VERSION."; exit 0; fi
          git commit -m "Point OpenKlack's update feed and install script at $VERSION"
          # The token is passed per command and never written to .git/config.
          for _ in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FEED_COMMIT_TOKEN" | base64 | tr -d '\n')" push "https://github.com/$REPO.git" HEAD:main; then exit 0; fi
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FEED_COMMIT_TOKEN" | base64 | tr -d '\n')" pull --rebase "https://github.com/$REPO.git" main
          done
          echo "::error::Could not push the feed to main after 3 attempts."; exit 1
      - name: Verify the live feed and download
        if: steps.order.outputs.promote == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          # The website deploys from main after the commit above.
          WAIT_SECONDS: "1500"
        run: apps/openklack-desktop/release/verify-live.sh "$VERSION" "$EXPECTED_SHA256"
      - name: Verify the live install script
        if: steps.order.outputs.promote == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
        run: scripts/release/verify-live-install-script.sh openklack "$VERSION" "$EXPECTED_SHA256"
      - name: Bump the cask
        if: steps.order.outputs.promote == 'true'
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          # The tap is pushed with a deploy key that can write only to that repository.
          umask 077; install -d "$RUNNER_TEMP/tap-key"; printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap-key/id"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/tap-key/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap-key/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/tap-key/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/tap-key"' EXIT
          git clone --depth 1 git@github.com:openappshq/homebrew-tap.git tap
          mkdir -p tap/Casks
          if [ ! -f tap/Casks/openklack.rb ]; then cp packaging/homebrew/Casks/openklack.rb tap/Casks/openklack.rb; fi
          packaging/homebrew/bump-cask.sh tap/Casks/openklack.rb "$VERSION" "$SHA256"
          cd tap
          git config user.name "openapps-release"
          git config user.email "release@openapps.space"
          git add Casks/openklack.rb
          if git diff --cached --quiet; then echo "The cask already names $VERSION."; exit 0; fi
          git commit -m "openklack $VERSION"
          git push origin HEAD
