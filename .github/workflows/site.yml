name: Website

# Builds the site and deploys it with the trial registry as one Cloudflare Worker.
# Pull requests only run checks: no job reachable from a PR holds Cloudflare
# credentials or touches remote resources. Setup and DNS cutover: docs/cloudflare.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openapps/site-worker typecheck
      - run: pnpm site:test

  deploy:
    # Stays off until the Cloudflare account, D1 database and website-live
    # environment exist: set the repository variable CLOUDFLARE_DEPLOY_ENABLED
    # to "true" then (see docs/cloudflare.md).
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: website-live
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - name: Build the site with live configuration
        env:
          VITE_DODO_CHECKOUT_ORIGIN: ${{ vars.VITE_DODO_CHECKOUT_ORIGIN }}
          VITE_OPENKLACK_DODO_PAID_PRODUCT_ID: ${{ vars.VITE_OPENKLACK_DODO_PAID_PRODUCT_ID }}
          VITE_OPENREACTION_DODO_PAID_PRODUCT_ID: ${{ vars.VITE_OPENREACTION_DODO_PAID_PRODUCT_ID }}
          VITE_HERTZ_DODO_PAID_PRODUCT_ID: ${{ vars.VITE_HERTZ_DODO_PAID_PRODUCT_ID }}
          VITE_MACPAPER_DODO_PAID_PRODUCT_ID: ${{ vars.VITE_MACPAPER_DODO_PAID_PRODUCT_ID }}
          VITE_OPENNOTES_DODO_PAID_PRODUCT_ID: ${{ vars.VITE_OPENNOTES_DODO_PAID_PRODUCT_ID }}
          VITE_OPENKLACK_BREW_CASK: ${{ vars.VITE_OPENKLACK_BREW_CASK }}
          VITE_OPENREACTION_BREW_CASK: ${{ vars.VITE_OPENREACTION_BREW_CASK }}
          VITE_HERTZ_BREW_CASK: ${{ vars.VITE_HERTZ_BREW_CASK }}
          VITE_MACPAPER_BREW_CASK: ${{ vars.VITE_MACPAPER_BREW_CASK }}
          VITE_OPENNOTES_BREW_CASK: ${{ vars.VITE_OPENNOTES_BREW_CASK }}
          VITE_OPENKLACK_MAC_DOWNLOAD_URL: ${{ vars.VITE_OPENKLACK_MAC_DOWNLOAD_URL }}
          VITE_OPENREACTION_MAC_DOWNLOAD_URL: ${{ vars.VITE_OPENREACTION_MAC_DOWNLOAD_URL }}
          VITE_HERTZ_MAC_DOWNLOAD_URL: ${{ vars.VITE_HERTZ_MAC_DOWNLOAD_URL }}
          VITE_MACPAPER_MAC_DOWNLOAD_URL: ${{ vars.VITE_MACPAPER_MAC_DOWNLOAD_URL }}
          VITE_OPENNOTES_MAC_DOWNLOAD_URL: ${{ vars.VITE_OPENNOTES_MAC_DOWNLOAD_URL }}
        run: pnpm build
      - name: Use the live database
        env:
          TRIAL_REGISTRY_D1_ID: ${{ vars.TRIAL_REGISTRY_D1_ID }}
        run: node apps/site-worker/scripts/set-database-id.mjs
      - name: Migrate and deploy
        working-directory: apps/site-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          pnpm exec wrangler d1 migrations apply trial-registry --remote
          pnpm exec wrangler deploy --message "main at $HEAD_SHA"
